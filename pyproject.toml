[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "player-information-football-prediction"
version = "0.1.0"
description = "Multi-league research on whether recent starting-player performance improves 1X2 forecasts beyond closing bookmaker odds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "requests>=2.32.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
