[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superleague-baseline"
version = "0.1.0"
description = "Leakage-safe historical match features and calibrated 1X2 baselines for Greek Super League research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "lightgbm>=4.5",
    "joblib>=1.4",
    "requests>=2.32.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
superleague-baseline = "superleague_baseline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["superleague_baseline*"]

[tool.pytest.ini_options]
markers = [
    "integration: tests against live player_stats.db",
]
testpaths = ["tests"]
